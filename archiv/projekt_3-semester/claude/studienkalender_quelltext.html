<title>Studienkalender WiSe 26/27</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: Kopf mit Wochennavigation und Klausurleiste, darunter der Wochenplan in voller Breite, darunter zwei Spalten: Nachholen | Aufgaben & Fristen */
:root{
  --bg:#f7f7f4; --surface:#ffffff; --line:#e6e6e0; --line-soft:#f0f0eb; --fg:#1f2328; --muted:#6b6f76; --accent:#1f2328;
  --mab004:#5f80b5; --mab004-bg:#eaf1fc;
  --mab005:#4f8f80; --mab005-bg:#e6f5f0;
  --pkb003:#b46b80; --pkb003-bg:#fbebef;
  --ewb001:#6d9156; --ewb001-bg:#edf5e5;
  --ewb002:#b5845a; --ewb002-bg:#fcf0e4;
  --pyb005:#8a77b5; --pyb005-bg:#f1edfa;
  --ma:#2f62c9; --ma-bg:#ebf1fc;
  --po:#cc3d55; --po-bg:#fcecef;
  --bw:#1f8a7a; --bw-bg:#e5f4f1;
  --catch:#e07a88; --catch-bg:#fcecee;
  --hw:#4b5563; --hw-bg:#eef0f3;
  --due:#c42b2b; --due-bg:#fde9e9;
  --today:#fffaf0; --now:#e5484d;
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151719; --surface:#1d2023; --line:#2e3236; --line-soft:#25292c; --fg:#ecedee; --muted:#9ba1a6; --accent:#ecedee;
  --ma:#8db2f5; --ma-bg:#1d2a40; --po:#f08a9b; --po-bg:#3a2329; --bw:#6fd0c0; --bw-bg:#1a3330;
  --catch:#ff7a8a; --catch-bg:#3d2026; --hw:#c3c8cf; --hw-bg:#2a2e33;
  --mab004:#8db2f5; --mab004-bg:#1d2a40; --mab005:#6fcde0; --mab005-bg:#163238; --pkb003:#f08a9b; --pkb003-bg:#3a2329;
  --ewb001:#7fd49a; --ewb001-bg:#1b3323; --ewb002:#f3a766; --ewb002-bg:#3a2814; --pyb005:#e895d2; --pyb005-bg:#3a2034; --due:#f28b8b; --due-bg:#3d2020; --today:#22241f; --now:#ff6b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151719; --surface:#1d2023; --line:#2e3236; --line-soft:#25292c; --fg:#ecedee; --muted:#9ba1a6; --accent:#ecedee;
  --ma:#8db2f5; --ma-bg:#1d2a40; --po:#f08a9b; --po-bg:#3a2329; --bw:#6fd0c0; --bw-bg:#1a3330;
  --catch:#ff7a8a; --catch-bg:#3d2026; --hw:#c3c8cf; --hw-bg:#2a2e33;
  --mab004:#8db2f5; --mab004-bg:#1d2a40; --mab005:#6fcde0; --mab005-bg:#163238; --pkb003:#f08a9b; --pkb003-bg:#3a2329;
  --ewb001:#7fd49a; --ewb001-bg:#1b3323; --ewb002:#f3a766; --ewb002-bg:#3a2814; --pyb005:#e895d2; --pyb005-bg:#3a2034; --due:#f28b8b; --due-bg:#3d2020; --today:#22241f; --now:#ff6b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.45rem;letter-spacing:-.01em}
h2{font-size:1rem}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ma);outline-offset:2px}

/* Kopf */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.title{display:flex;flex-direction:column;gap:2px}
.sub{color:var(--muted);font-size:.92rem}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.icon{width:36px;padding:0;display:inline-grid;place-items:center;font-size:1.1rem}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}

/* Klausurleiste */
.exams{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.exam{flex:none;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:132px;text-align:left}
.exam:hover{border-color:var(--muted)}
.exam .d{font-weight:700}
.exam .n{font-size:.82rem;color:var(--muted)}
.exam .left{font-size:.75rem;color:var(--due);font-weight:700}
.exams-label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Woche */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.week{min-width:760px;display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr))}
.dhead{padding:10px 10px 8px;border-left:1px solid var(--line-soft);display:flex;align-items:baseline;gap:6px}
.dhead .dn{font-size:.85rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dhead .dd{font-size:.85rem;font-weight:700}
.dhead.is-today .dd{background:var(--fg);color:var(--bg);border-radius:999px;padding:0 8px}
.strip{border-left:1px solid var(--line-soft);border-bottom:1px solid var(--line);padding:0 6px 8px;display:flex;flex-direction:column;gap:3px;min-height:12px}
.corner{border-bottom:1px solid var(--line)}
.corner.top{border-bottom:0}
.hours div{height:var(--hour);font-size:.72rem;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-.65em)}
.hours div:first-child{visibility:hidden}
.day{position:relative;border-left:1px solid var(--line-soft);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px);background-size:100% var(--hour)}
.day.is-today,.dhead.is-today,.strip.is-today{background-color:var(--today)}
.ev{position:absolute;border:0;border-radius:8px;padding:6px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:2px;
  background:var(--c-bg);box-shadow:inset 3px 0 0 var(--c);font-size:.78rem;line-height:1.25;min-width:0}
.ev{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 30%,var(--c-bg))}
.ev:hover{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 30%,var(--c-bg)),0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.ev .q{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--surface);color:var(--muted);font-size:.66rem;font-weight:800;box-shadow:0 0 0 1px var(--line)}
.ev .ok{color:var(--c);font-size:.75rem;line-height:1}
.toprows{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 14px;align-items:center}
.rowc{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.pill .pt{max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.late .pd{color:var(--due);font-weight:700}
.exams{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 11px;font-size:.8rem;background:var(--c-bg);color:var(--fg)}
.pill b{color:var(--c)}
.pill:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.examnote{font-size:.8rem;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px color-mix(in srgb,#000 12%,transparent)}
.seg button.no[aria-pressed="true"]{color:var(--catch)}
.fieldlabel{font-size:.8rem;color:var(--muted);font-weight:700}
.ev.ma{--c:var(--ma);--c-bg:var(--ma-bg)} .ev.po{--c:var(--po);--c-bg:var(--po-bg)} .ev.bw{--c:var(--bw);--c-bg:var(--bw-bg)}
.ev .code{color:var(--c);font-weight:700;font-size:.72rem;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ev .t{font-weight:700;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.ev .m{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .dot{width:7px;height:7px;border-radius:50%;background:var(--catch);flex:none}
.ev.done .dot{background:var(--bw)}
.ev.done{opacity:.6}
.ev.narrow{padding:6px 6px}
.ev.narrow .t{-webkit-line-clamp:2}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.chip{border:0;border-radius:6px;padding:3px 7px;font-size:.74rem;text-align:left;line-height:1.25;width:100%;background:var(--k-bg);color:var(--k);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-hausaufgabe{--k:var(--hw);--k-bg:var(--hw-bg)} .k-frist,.k-pruefung{--k:var(--due);--k-bg:var(--due-bg)}
.k-todo{--k:var(--muted);--k-bg:var(--line-soft)}
.k-nachholen{--k:var(--catch);--k-bg:var(--catch-bg)} .k-termin{--k:var(--muted);--k-bg:var(--line-soft)}
.chip.k-pruefung,.chip.k-frist{font-weight:700}
.chip.erledigt{text-decoration:line-through;opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Listen unten */
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:820px){.lists{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:.85rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ewb001);border-radius:3px;transition:width .3s}
.group{display:flex;flex-direction:column;gap:2px}
.group-h{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px 2px;display:flex;justify-content:space-between}
details.fold>summary{cursor:pointer;list-style:none;border-radius:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary>span:first-child::before{content:"›";display:inline-block;width:1em;transition:transform .15s;font-size:1rem;line-height:1}
details.fold[open]>summary>span:first-child::before{transform:rotate(90deg)}
details.fold>summary:hover{background:var(--bg)}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:8px}
.list li:hover{background:var(--bg)}
.list input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--fg);flex:none}
.list .txt{min-width:0;flex:1;font-size:.9rem;display:flex;flex-direction:column;gap:1px}
.list .txt .ti{font-weight:700;border:0;background:none;padding:0;text-align:left}
.list .txt small{color:var(--muted);font-size:.8rem}
.list .lt .dt{display:inline-block;min-width:4.6em;margin-right:.4em;color:var(--muted)}
#catchList .list li{padding:4px 4px}
#catchList{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.list .done .ti,.list .done .lt{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--k-bg);color:var(--k);margin-right:4px}
.late{color:var(--due)!important;font-weight:700}
.empty{font-size:.88rem;color:var(--muted);padding:6px 4px}
.textbtn{border:0;background:none;color:var(--muted);padding:4px;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.note{font-size:.8rem;color:var(--muted)}

/* Dialog */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 35%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(460px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dialog .eyebrow{font-size:.78rem;font-weight:700;color:var(--c,var(--muted))}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-weight:400;min-width:0;width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toggle{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg)}
.toggle input{width:18px;height:18px;accent-color:var(--fg)}
.status{font-size:.82rem;color:var(--muted)}
.danger{color:var(--due)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  <header>

    ok.disabled=true;st.textContent='Speichert …';
    const r=await saveEntry({id:e.id,titel:titel.value.trim(),art:art.value,modul:modul.value,datum:datum.value,zeit:zeit.value,notiz:notiz.value.trim(),erledigt:done?done.checked:false});
    if(r)close();else{st.textContent='Speichern hat nicht geklappt. Bitte später noch einmal versuchen.';ok.disabled=false}};
  if(!canWrite)st.textContent='In dieser Ansicht kann nichts gespeichert werden.';
  dlg.append(f);ov.hidden=false;titel.focus();
}

// ---------- Speichern ----------
async function setMark(key,patch){const next={...(marks[key]||{}),...patch};delete next.geaendert;marks={...marks,[key]:next};render();
  if(!db)return;try{await db.collection('sitzungen').doc(key).set({...next,geaendert:new Date().toISOString()})}catch(err){handleErr(err)}}
async function saveEntry(e){
  const id=e.id||('e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const body={datum:e.datum,zeit:e.zeit||'',art:e.art,modul:e.modul||'',titel:e.titel,notiz:e.notiz||'',erledigt:!!e.erledigt};
  const i=entries.findIndex(x=>x.id===id);const next=[...entries];if(i>=0)next[i]={id,...body};else next.push({id,...body});entries=next;render();
  if(!db)return true;try{await db.collection('eintraege').doc(id).set(body);return true}catch(err){handleErr(err);return false}
}
async function removeEntry(e){entries=entries.filter(x=>x.id!==e.id);render();if(db)try{await db.collection('eintraege').doc(e.id).delete()}catch(err){handleErr(err)}}
function handleErr(err){if(err&&err.code==='invalid_argument'){canWrite=false;$('dbNote').textContent='Du kannst diesen Kalender ansehen, aber nichts ändern.';render()}
  else $('dbNote').textContent='Eine Änderung konnte nicht gespeichert werden. Bitte Seite neu laden.'}

$('prev').onclick=()=>{weekStart=iso(addDays(parse(weekStart),-7));renderWeek()};
$('next').onclick=()=>{weekStart=iso(addDays(parse(weekStart),7));renderWeek()};
$('today').onclick=()=>{weekStart=mondayOf(new Date());renderWeek()};
$('addBtn').onclick=()=>openEntry({});
$('showDone').onclick=()=>{showDone=!showDone;renderLists()};
$('showDoneCatch').onclick=()=>{showDoneCatch=!showDoneCatch;renderLists()};
render();

(async()=>{
  try{db=window.claude&&await window.claude.use('db')}catch(e){db=null}
  if(!db){canWrite=false;$('dbNote').textContent='Speichern ist in dieser Ansicht nicht verfügbar. Du siehst nur den Stundenplan.';$('addBtn').hidden=true;render();return}
  try{const u=await window.claude.use('user');const c=u&&await u.can('data.write');if(c===false){canWrite=false;$('addBtn').hidden=true;$('dbNote').textContent='Du kannst diesen Kalender ansehen, aber nichts ändern.'}}catch(e){}
  db.collection('eintraege').onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));render()},handleErr);
  db.collection('sitzungen').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});marks=m;render()},handleErr);
})();
})();
</script>
